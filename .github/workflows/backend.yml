name: Alpha checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flavorbuddy
          POSTGRES_USER: flavorbuddy
          POSTGRES_PASSWORD: flavorbuddy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flavorbuddy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test scrape_me integrations kitchen
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python manage.py collectstatic --noinput
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
        env:
          FLAVORBUDDY_PYTHON: python
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: 'false'
          DJANGO_SECRET_KEY: ci-only-validation-abcdefghijklmnopqrstuvwxyz-0123456789
          DJANGO_ALLOWED_HOSTS: alpha.example.com
          PROJECT_URL: https://alpha.example.com
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results
