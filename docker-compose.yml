services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flavorbuddy}
      POSTGRES_USER: ${POSTGRES_USER:-flavorbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flavorbuddy}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flavorbuddy}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
